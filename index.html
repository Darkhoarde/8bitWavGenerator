<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Production App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Music Studio</h1>
      <div class="controls">
        <div class="control-group">
          <label for="tempo">Tempo (BPM)</label>
          <input type="number" id="tempo" value="120" min="30" max="300">
          <input type="range" id="tempo-slider" value="120" min="30" max="300">
        </div>
        <div class="control-group">
          <label for="beats">Beats/Measure</label>
          <input type="number" id="beats" value="4" min="1" max="16">
        </div>
        <div class="control-group">
          <label for="total-steps">Total Steps</label>
          <input type="number" id="total-steps" value="32" min="1" max="512">
        </div>
        <div class="control-group">
          <label for="length-sec">Length (sec)</label>
          <input type="number" id="length-sec" value="4" min="0.1" max="60" step="0.1">
        </div>
        <div class="buttons">
          <button id="play-btn">Play</button>
          <button id="stop-btn">Stop</button>
          <button id="clear-btn">Clear</button>
          <button id="export-btn">Export WAV</button>
        </div>
      </div>
    </header>
    <main>
      <div id="piano-roll">
        <div id="note-labels"></div>
        <div id="grid-container">
          <div id="grid"></div>
          <div id="playhead"></div>
          <div id="selection-rect"></div>
        </div>
      </div>
      <div id="info">
        <p>Click grid cells to toggle notes. Each row is a pitch, each column is a step.</p>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
